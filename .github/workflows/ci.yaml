name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Cargo checks
  cargo-check:
    runs-on: matterlabs-ci-runner-high-performance
    container:
      image: ghcr.io/matter-labs/zksync-llvm-runner:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # This step is required to checkout submodules
      # that are disabled in .gitmodules config
      - name: Checkout submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --force --depth=1 --recursive --checkout

      - name: Build LLVM
        uses: matter-labs/era-compiler-ci/.github/actions/build-llvm@v1
        with:
          clone-llvm: 'false'
          build-type: 'RelWithDebInfo'
          enable-assertions: true

      # NOTE: This inlines matter-labs/era-compiler-ci/.github/actions/cargo-check@v1
      # to work around cargo-udeps failing to build under the pinned stable toolchain:
      # the latest cargo-udeps pulls cargo@0.96.0 which requires rustc >= 1.93, while
      # rust-toolchain.toml pins 1.88.0. The shared action installs nightly and runs
      # udeps with it, but builds the tool with plain `cargo install`, so it is built
      # under stable and fails. Building it with +nightly avoids bumping the release
      # toolchain. era-compiler-solidity carries the same workaround. Once the shared
      # action installs cargo-udeps with +nightly, this can be reverted to the
      # composite action call.
      #
      # github_token is not passed on: the shared action forwards it only to the
      # optional rustsec/audit-check step, which is disabled by default and was not
      # enabled here.
      - name: Install rustc nightly
        shell: bash
        run: rustup toolchain install nightly nightly-2025-06-01 --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cargo-cache-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: "--allow unmaintained --hide-inclusion-graph"

      - name: Cargo check
        shell: bash
        run: cargo check --verbose

      - name: Cargo format
        shell: bash
        run: cargo fmt --all -- --check --verbose

      - name: Cargo clippy
        shell: bash
        run: cargo clippy

      - name: Cargo udeps
        shell: bash
        run: |
          cargo +nightly install cargo-udeps --locked
          cargo +nightly udeps --all-targets

  # Build and run regression tests
  build-and-test:
    runs-on: matterlabs-ci-runner-high-performance
    container:
      image: ghcr.io/matter-labs/zksync-llvm-runner:latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # This step is required to checkout submodules
      # that are disabled in .gitmodules config
      - name: Checkout submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --force --depth=1 --recursive --checkout

      - name: Build LLVM
        uses: matter-labs/era-compiler-ci/.github/actions/build-llvm@v1
        with:
          clone-llvm: 'false'
          build-type: 'RelWithDebInfo'
          enable-assertions: true

      - name: Run tests
        uses: matter-labs/era-compiler-ci/.github/actions/rust-unit-tests@v1
        with:
          target: ${{ env.TARGET }}
          enable-coverage: ${{ github.event_name == 'push' }}
          coverage-token: ${{ secrets.CODECOV_TOKEN }}

  # Special job that allows some of the jobs to be skipped or failed
  # requiring others to be successful
  pr-checks:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - cargo-check
      - build-and-test
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
